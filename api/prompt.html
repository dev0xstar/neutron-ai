{"data":"<html lang=\"en\"><head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Program: Stellar Gaze</title>\n  <style>\n    /* Base styles - dark mode */\n    body {\n      font-family: Arial, sans-serif;\n      color: #e0e0e0;\n      background-color: #121212;\n      margin: 0;\n      padding: 0;\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      justify-content: center;\n      min-height: 100vh;\n      box-sizing: border-box;\n    }\n\n    h1, p {\n      text-align: center;\n    }\n\n    /* Unique program container */\n    .stellar-container {\n      background-color: #1e1e1e;\n      border-radius: 8px;\n      padding: 16px;    /* 2 * 8px */\n      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);\n      max-width: 480px;\n      width: 100%;\n      margin: 16px;   /* 2 * 8px */\n    }\n\n    .stellar-button {\n      display: inline-block;\n      margin: 8px 0;\n      padding: 16px;  /* 2 * 8px */\n      text-decoration: none;\n      text-align: center;\n      background: #007BFF;\n      color: #ffffff;\n      font-size: 16px;  /* Multiply by 8 equals 16px */\n      font-weight: bold;\n      cursor: pointer;\n      border: none;\n      border-radius: 4px;\n      transition: all 0.3s ease;\n    }\n\n    .stellar-button:hover {\n      background: #0056b3;\n    }\n\n    /* Responsive adjustments */\n    @media (max-width: 480px) {\n      .stellar-container {\n        margin: 8px; /* Adjust margin for smaller screens */\n        padding: 8px; /* Reduce padding for smaller screens */\n      }\n\n      .stellar-button {\n        font-size: 14px;\n      }\n    }\n  </style>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"./application/custom.css\"></head>\n<body>\n  <div class=\"stellar-container\">\n    <h1>Welcome to Stellar Gaze</h1>\n    <p>Hi. This is a simple and responsive program with a clean dark-themed design.</p>\n    <p>Click the button below to get started:</p>\n    <button class=\"stellar-button\" onclick=\"handleButtonClick()\">Click Me</button>\n  </div>\n\n  <script>\n    function handleButtonClick() {\n      alert('Hello! You just interacted with Stellar Gaze.');\n    }\n  </script>\n\n</body></html>","name":"Program: Stellar Gaze"}
